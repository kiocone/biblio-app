<div class="book-card" (click)="onSelectBook(book?.id)">
  <img [src]="book?.coverImageUrl" alt="{{ book?.title }}" class="book-image" />
  <div class="book-details">
    <h3>{{ book?.title }}</h3>
    @if (book?.author !== ''){<p><strong>Autor:</strong> {{ book?.author }}</p>}
    @if (book?.publishedYear !== ''){<p><strong>Año:</strong> {{ book?.publishedYear }}</p>}
    @if (book?.editorial !== ''){<p><strong>Editorial:</strong> {{ book?.editorial }}</p>}
  </div>
</div>
