<div class="header">
  <img
    src="assets/serenisima-logo.png"
    alt="Serenisima Logo"
    class="logo"
    />
  <div class="header-text">
    <h1 class="header-title">Biblioteca de la Serenisima</h1>
    <strong>V0.1.0 (beta)</strong>
  </div>
</div>
<finder
  class="book-finder"
  (searchEvent)="onSearch($event)"
></finder>
<app-book
  class="book-card-container"
  [findBook]="searchTerm"
  (selectBook)="onSelectBook($event)"
></app-book>

<router-outlet />
