<div class="header">
  <img
    src="assets/serenisima-logo.png"
    alt="Serenisima Logo"
    class="logo"
  />
  <div class="header-text">
    <h1 class="header-title">Biblioteca de la Serenisima</h1>
    <strong>V0.8.0 (beta)</strong>
    <nav class="auth-nav">
      @if (!(isLoggedIn$ | async)) {
        <a (click)="login()">Login</a>
      }
      @if (isLoggedIn$ | async) {
        <a (click)="logout()">{{ (user$ | async)?.fullname + " - " }} Logout</a>
      }
    </nav>
  </div>
</div>
@if (!(isLoggedIn$ | async) && showLogin === true) {
  <app-login (cancelLogin)="showLogin = false"></app-login>
}
<div class="main-container">
  <router-outlet />
  <div class="footer">
    <p>
      <strong>Desarrollado por: </strong>
      <a href="https://kiocone.com">Kiocone</a>
    </p>
  </div>
  <button class="next-page-down" (click)="loadNextPage()">
    <div>&#x2B07;</div>
  </button>
  <button class="scroll-to-top" (click)="scrollToTop()">
    <div>&#x2B06;</div>
  </button>
</div>
<toast></toast>
