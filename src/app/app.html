<div class="header">
  <img
    src="assets/serenisima-logo.png"
    alt="Serenisima Logo"
    class="logo"
    />
  <div class="header-text">
    <h1 class="header-title">Biblioteca de la Serenisima</h1>
    <strong>V0.1.1 (beta)</strong>
  </div>
</div>
<finder
  class="book-finder"
  [showBackButton]="bookDetailView"
  (searchEvent)="onSearch($event)"
  (backEvent)="onMainViewClick()"
></finder>
@if (selectedBook) {
  <book-detail
    [book]="selectedBook"
  ></book-detail>
} @else {
  <app-book
    class="book-card-container"
    [findBook]="searchTerm"
    (selectBook)="onSelectBook($event)"
  ></app-book>
}
<button class="scroll-to-top" (click)="scrollToTop()">
  <i class="arrow-up-icon"><strong>&#8593;</strong></i>
</button>
