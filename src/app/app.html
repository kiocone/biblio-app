<div class="header">
  <img
    src="assets/serenisima-logo.png"
    alt="Serenisima Logo"
    class="logo"
  />
  <div class="header-text">
    <h1 class="header-title">Biblioteca de la Serenisima</h1>
    <strong>V0.6.0 (beta)</strong>
    <nav class="auth-nav">
      <a (click)="login()" *ngIf="!(isLoggedIn$ | async)">Login</a>
      <a (click)="logout()" *ngIf="isLoggedIn$ | async"> {{ (user$ | async)?.fullname + " - "}} Logout</a>
    </nav>
  </div>
</div>
@if (!(isLoggedIn$ | async) && showLogin === true) {
  <app-login (cancelLogin)="showLogin = false"></app-login>
}
<div class="main-container">
  <finder
    class="book-finder"
    [showBackButton]="bookDetailView"
    (searchEvent)="onSearch($event)"
    (backEvent)="onMainViewClick()"
  />
  @if (selectedBook) {
    <book-detail
      [book]="selectedBook"
    ></book-detail>
  } @else {
    <app-book
      class="book-card-container"
      [findBook]="searchTerm"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      (selectBook)="onSelectBook($event)"
    ></app-book>
  }
  <div class="footer">
    <p>
      <strong>Desarrollado por: </strong>
      <a href="https://kiocone.com">Kiocone</a>
    </p>
  </div>
    @if (!selectedBook) {
      <button class="next-page-down" (click)="loadNextPage()">
        <div>&#x2B07;</div>
      </button>
      <button class="scroll-to-top" (click)="scrollToTop()">
        <div>&#x2B06;</div>
      </button>
    }
</div>
<toast></toast>
