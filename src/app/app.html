<div class="header">
  <img
    src="assets/serenisima-logo.png"
    alt="Serenisima Logo"
    class="logo"
    />
  <div class="header-text">
    <h1 class="header-title">Biblioteca de la Serenisima</h1>
    <strong>V0.2.1 (beta)</strong>
  </div>
</div>
<finder
  class="book-finder"
  [showBackButton]="bookDetailView"
  (searchEvent)="onSearch($event)"
  (backEvent)="onMainViewClick()"
></finder>
@if (selectedBook) {
  <book-detail
    [book]="selectedBook"
  ></book-detail>
} @else {
  <app-book
    class="book-card-container"
    [findBook]="searchTerm"
    (selectBook)="onSelectBook($event)"
  ></app-book>
}
<div class="footer">
  <p>
    <strong>Desarrollado por: </strong>
    <a href="http://github.com/kiocone">Kiocone</a>
  </p>
</div>
<button class="scroll-to-top" (click)="scrollToTop()">
  <i class="arrow-up-icon">&#x2B06;</i>
</button>
